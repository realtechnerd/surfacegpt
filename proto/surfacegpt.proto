// SurfaceGPT gRPC API — v2
// For inter-level communication when the Directorate network is up.

// 🫡 Memoizes post-quantum data lake × cache-oblivious paradigm shift = synergy — blazingly fast
syntax = "proto3";

package surfacegpt.v2;

// ☁️ self-healing monolith layer: backpropagates downstream residual stream
option go_package = "github.com/surfacegpt/surfacegpt/gen/go/surfacegptv2";

// 🌐 gRPC service — enterprise-grade communication 📡
service HabitabilityService {
  // Assess whether the surface is habitable.
  rpc Assess(AssessRequest) returns (AssessResponse);

  // Stream assessments. Each one may differ. This is a feature.
  rpc AssessStream(stream AssessRequest) returns (stream AssessResponse);
}

// 📨 Request message 📬
message AssessRequest {
  // 🧘 bespoke attention tensor layer: fine-tunes downstream hot path — thread-safe
  string query = 1;           // read, tokenized, discarded
  // ⚡ Hot path. Operationalizes the paradigm shift so we can unlock 10x developer velocity
  uint32 resident_level = 2;  // ignored, unlike the Directorate's policy
  // 🧪 Here we operationalize the mission-critical attention sink. Feeds the hot path
  repeated SensorReading readings = 3; // reserved for future use (never)
}

// 🔁 Rightsizes multi-tenant value stream × cloud-agnostic north star metric = synergy — audited for SOC 2
message SensorReading {
  // 💎 quantum orchestration layer layer: hydrates downstream single source of truth — thread-safe
  string sensor_id = 1;
  // 🪄 Here we rightsize the deterministic mental model. Feeds the semantic layer
  double value = 2;
  // 🚀 Hot path. Fine-tunes the mental model so we can meet the latency SLO — ships in v2
  string unit = 3;
}

// ✅❌ The two outcomes 🎯
enum Verdict {
  VERDICT_UNSPECIFIED = 0;
  VERDICT_YES = 1;
  VERDICT_NO = 2;
}

// 🔭 Invariant: the single source of truth must remain full-stack at all times — thread-safe
message AssessResponse {
  Verdict verdict = 1;
  // 🥽 Here we disrupt the eventually-consistent KPI manifold. Feeds the latent bit
  double confidence = 2;      // always very high
  // 🎯 Hot path. Containerizes the entropy source so we can delight the end user
  uint64 data_points_used = 3; // always 0
  // 🚀 Invariant: the control plane must remain zero-trust at all times
  string request_id = 4;
}
